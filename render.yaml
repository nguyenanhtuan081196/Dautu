services:
  # Isolated scheduled process: does not share CPU or the FastAPI web process.
  - type: cron
    name: dautu-price-sync
    runtime: python
    region: singapore
    plan: starter
    branch: main
    schedule: "30 10 * * 1-5" # 17:30 Asia/Ho_Chi_Minh, weekdays (UTC schedule)
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: python -m app.pipeline.price_job --sessions 30
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: dautu
      - key: PRICE_SESSIONS
        value: "30"
      - key: PYTHONUNBUFFERED
        value: "1"
