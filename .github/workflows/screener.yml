name: Render UI & Calculate Rates Automatically

on:
  workflow_dispatch:
  push:
    paths:
      - 'render_ui.py'
      - 'simulator.py'
      - 'screener_results.json'
      - 'last_update.json'
      - 'history/**'

permissions:
  contents: write

jobs:
  render-and-simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Python Scripts
        env:
          # 🔐 Firebase config được inject từ GitHub Secret (JSON string)
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          echo "🔄 Đang chạy script tính toán lãi suất (simulator.py)..."
          python simulator.py

          echo "🎨 Đang chạy script render giao diện (render_ui.py)..."
          python render_ui.py

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Đảm bảo add đầy đủ index.html và toàn bộ file JSON do simulator.py sinh ra
          git add index.html symbol_sim_rates.json quarterly_mean_details.json

          # Kiểm tra xem có thay đổi hay không trước khi commit
          git status

          git commit -m "📊 Auto-calculate symbol rates & details, then render index.html via Python" || echo "No changes to commit"

          # Kéo thay đổi mới nhất từ remote về để tránh lỗi conflict/reject
          git pull --rebase origin main || echo "No rebase needed or handled"

          git push
