name: Calculate Simulation Rates (No UI Rendering)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'simulator.py'
      - 'screener_results.json'
      - 'last_update.json'
      - 'history/**'

permissions:
  contents: write

concurrency:
  group: dautu-render-main
  cancel-in-progress: false

jobs:
  calculate-simulations:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Refresh production branch
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests "pymongo>=4.10,<5"

      - name: Calculate simulation metrics only
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: dautu
          PYTHONUNBUFFERED: 1
        run: python simulator.py

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Never stage the production frontend entry point from this data workflow.
          git add symbol_sim_rates.json quarterly_mean_details.json

          # Kiểm tra xem có thay đổi hay không trước khi commit
          git status

          git commit -m "📊 Auto-calculate symbol rates & details (no UI rendering)" || echo "No changes to commit"

          # Kéo thay đổi mới nhất từ remote về để tránh lỗi conflict/reject
          git pull --rebase origin main

          git push
