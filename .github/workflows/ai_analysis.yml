name: 2. Run AI Deep Analysis

on:
  schedule:
    - cron: '30 18 * * 5'   # 1h30 sáng thứ 7 giờ VN
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Nhập mã cổ phiếu cần phân tích (cách nhau bằng dấu phẩy). Để trống nếu muốn chạy theo Top ngành.'
        required: false
        default: ''
        type: string
      mode:
        description: 'Chế độ chạy'
        required: true
        default: 'top'
        type: choice
        options:
          - top      # Chỉ chạy top đầu mỗi ngành (không chia batch)
          - rest     # Chỉ chạy phần còn lại (chia batch)
          - all      # Chạy cả top và batch hiện tại của phần còn lại
      batch:
        description: 'Batch hiện tại (chỉ dùng cho mode=rest hoặc all)'
        required: false
        default: '1'
        type: string
      total_batches:
        description: 'Tổng số batch chia phần còn lại'
        required: false
        default: '1'
        type: string
      force:
        description: 'Ép phân tích lại (bỏ qua resume 7 ngày)'
        required: false
        default: false
        type: boolean

jobs:
  ai-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run AI Deep Analysis
        env:
          ALIBABA_API_KEY: ${{ secrets.ALIBABA_API_KEY }}
          INPUT_SYMBOLS: ${{ inputs.symbols }}
          PYTHONUNBUFFERED: 1
          MODE: ${{ inputs.mode || 'top' }}
          BATCH: ${{ inputs.batch || '1' }}
          TOTAL_BATCHES: ${{ inputs.total_batches || '1' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          echo "Mode=$MODE | Batch=$BATCH/$TOTAL_BATCHES | Force=$FORCE | Symbols=$INPUT_SYMBOLS"
          python analyze_ai.py --mode "$MODE" --batch "$BATCH" --total-batches "$TOTAL_BATCHES" $FORCE

      - name: Commit and push AI results
        if: always()   # vẫn commit nếu chạy xong một phần (vì script đã ghi data.json sau mỗi mã)
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Không có thay đổi để commit."
          else
            LABEL="${{ inputs.symbols || (inputs.mode == 'rest' && format('Rest batch {0}/{1}', inputs.batch, inputs.total_batches)) || 'Top ngành tự động' }}"
            git commit -m "🤖 [AI Analysis] ${LABEL} [$(date +'%Y-%m-%d %H:%M')]"
            git push
          fi
