name: 1. Run Quant Screener

on:
  push:
    branches: [main]
    paths:
      - 'last_update.json'
  workflow_dispatch:

concurrency:
  group: dautu-data-main
  cancel-in-progress: false

jobs:
  screener:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Refresh production branch
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests "pymongo>=4.10,<5"

      - name: Run Advanced Quant Screener
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: dautu
          PYTHONUNBUFFERED: 1
        run: python advanced_screener.py

      - name: Commit and push screener results
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add screener_results.json screener_summary.csv data.json
          git diff --quiet && git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "📊 [Screener] Cập nhật kết quả định lượng mới [$(date +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push origin main
