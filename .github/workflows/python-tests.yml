name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dautu
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create read-only server-platform installation token
        id: platform-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SERVER_PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.SERVER_PLATFORM_APP_PRIVATE_KEY }}
          owner: nguyenanhtuan081196
          repositories: server-platform
          permission-contents: read
      - name: Checkout pinned server-platform source
        uses: actions/checkout@v4
        with:
          repository: nguyenanhtuan081196/server-platform
          ref: b928015c10a332fa783e76e9160db2e9336d6085
          token: ${{ steps.platform-token.outputs.token }}
          path: .dependencies/server-platform
          persist-credentials: false
      - name: Install test dependencies
        run: |
          python -m pip install pandas "pymongo>=4.10,<5" "fastapi>=0.115,<1" "firebase-admin>=6.5,<8" "PyJWT[crypto]>=2.8,<3"
          python -m pip install .dependencies/server-platform
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run API authentication security tests
        run: python -m unittest discover -s tests -p 'test_api_auth.py' -v
      - name: Run Quant Screener smoke test against repository data
        run: python advanced_screener.py --smoke-test-json

  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firestore Rules Emulator tests
        run: npm run test:rules
