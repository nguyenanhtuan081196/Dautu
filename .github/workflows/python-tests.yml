name: Python tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Load read-only server-platform deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_PLATFORM_DEPLOY_KEY }}
      - name: Trust GitHub SSH host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Install test dependencies
        run: python -m pip install pandas "pymongo>=4.10,<5" "fastapi>=0.115,<1" "firebase-admin>=6.5,<8" "server-platform @ git+ssh://git@github.com/nguyenanhtuan081196/server-platform.git@b928015c10a332fa783e76e9160db2e9336d6085"
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run API authentication security tests
        run: python -m unittest discover -s tests -p 'test_api_auth.py' -v
      - name: Run Quant Screener smoke test against repository data
        run: python advanced_screener.py --smoke-test-json

  firestore-rules-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Firebase test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firestore Rules Emulator tests
        run: npm run test:rules
