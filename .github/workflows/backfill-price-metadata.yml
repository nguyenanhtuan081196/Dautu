name: Backfill price metadata (2026-11-13)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MongoDB driver
        run: python -m pip install "pymongo>=4.10,<5"

      - name: Backfill metadata from the successful Atlas pipeline run
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: dautu
        run: python -m scripts.backfill_price_metadata
