name: Import legacy JSON to MongoDB Atlas

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run only, or import records to Atlas"
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirmation:
        description: 'For apply only, type exactly: IMPORT_TO_ATLAS'
        required: false
        type: string

permissions:
  contents: read

jobs:
  import-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate apply confirmation
        if: inputs.mode == 'apply'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "IMPORT_TO_ATLAS" ]; then
            echo "::error::Apply requires confirmation text IMPORT_TO_ATLAS"
            exit 1
          fi

      - name: Dry-run inventory
        if: inputs.mode == 'dry-run'
        run: python scripts/migrate_json_to_mongo.py

      - name: Import JSON snapshots to Atlas
        if: inputs.mode == 'apply'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: dautu
        run: python scripts/migrate_json_to_mongo.py --apply
