name: Import legacy JSON to MongoDB Atlas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mongodb-import.yml"
      - "scripts/migrate_json_to_mongo.py"
      - "app/database/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run only, or import records to Atlas"
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run
      confirmation:
        description: 'For apply only, type exactly: IMPORT_TO_ATLAS'
        required: false
        type: string

permissions:
  contents: read

jobs:
  import-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install only the dependencies needed by the migration. The Dautu
      # MongoDB adapter delegates URI validation to the shared platform package;
      # avoid the full app requirements because vnstock/pandas are not used here.
      - name: Install migration dependencies
        run: |
          python -m pip install "pymongo>=4.10,<5"
          python -m pip install "server-platform @ git+https://github.com/nguyenanhtuan081196/server-platform.git@b928015c10a332fa783e76e9160db2e9336d6085"

      - name: Validate apply confirmation
        if: inputs.mode == 'apply'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "IMPORT_TO_ATLAS" ]; then
            echo "::error::Apply requires confirmation text IMPORT_TO_ATLAS"
            exit 1
          fi

      - name: Dry-run inventory
        if: inputs.mode != 'apply'
        run: python scripts/migrate_json_to_mongo.py

      - name: Import JSON snapshots to Atlas
        if: inputs.mode == 'apply'
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: dautu
        run: python scripts/migrate_json_to_mongo.py --apply
