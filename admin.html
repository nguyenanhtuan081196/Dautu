<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dautu · Admin</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script><script src="./api-config.js"></script></head>
<body class="min-h-screen bg-slate-950 text-slate-100"><header class="border-b border-slate-800 bg-slate-900"><div class="mx-auto flex max-w-6xl items-center justify-between p-5"><div><p class="text-xs tracking-widest text-emerald-400">DAUTU · ADMIN</p><h1 class="text-xl font-bold">Quản lý tài khoản</h1></div><button id="back" class="rounded border border-slate-700 px-3 py-2">Về ứng dụng</button></div></header>
<main class="mx-auto max-w-6xl space-y-5 p-5"><div id="notice" class="hidden rounded-lg border p-4 text-sm"></div><section id="panel" class="hidden space-y-5"><div class="flex items-center justify-between"><div><h2 class="font-semibold">Danh sách người dùng</h2><p id="who" class="text-sm text-slate-400"></p></div><button id="refresh" class="rounded bg-emerald-400 px-4 py-2 font-semibold text-slate-950">Làm mới</button></div>
<div class="grid grid-cols-3 gap-3"><div class="rounded-lg bg-slate-900 p-4"><p class="text-xs text-slate-400">Tổng</p><b id="total" class="text-2xl">0</b></div><div class="rounded-lg bg-slate-900 p-4"><p class="text-xs text-slate-400">Hoạt động</p><b id="active" class="text-2xl">0</b></div><div class="rounded-lg bg-slate-900 p-4"><p class="text-xs text-slate-400">Đã khóa</p><b id="locked" class="text-2xl">0</b></div></div>
<div class="overflow-x-auto rounded-lg border border-slate-800 bg-slate-900"><table class="w-full min-w-[850px] text-left text-sm"><thead class="bg-slate-800 text-xs"><tr><th class="p-3">Email</th><th class="p-3">Vai trò</th><th class="p-3">Trạng thái</th><th class="p-3">Hết hạn</th><th class="p-3">Thao tác</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const cfg={"apiKey":"AIzaSyB8YCwimpKkI1b4xFpRN_xnocrNop-0JWY","authDomain":"dau-tu-65931.firebaseapp.com","projectId":"dau-tu-65931","storageBucket":"dau-tu-65931.firebasestorage.app","messagingSenderId":"272291194014","appId":"1:272291194014:web:f1438a67771f48c931878f"};
if(!firebase.apps.length)firebase.initializeApp(cfg);const auth=firebase.auth(),API=String(window.DAUTU_API_BASE_URL||'https://dautu-api.onrender.com').replace(/\/+$/,'');
const notice=document.getElementById('notice'),panel=document.getElementById('panel'),rows=document.getElementById('rows');let users=[];
function msg(t,err=false){notice.textContent=t;notice.className='rounded-lg border p-4 text-sm '+(err?'border-rose-700 bg-rose-950 text-rose-200':'border-slate-700 bg-slate-900');notice.classList.remove('hidden');}
async function call(path,method='GET',body){const u=auth.currentUser;if(!u)throw Error('Phiên đăng nhập hết hạn.');const res=await fetch(API+path,{method,headers:{Authorization:'Bearer '+await u.getIdToken(),'Content-Type':'application/json','Accept':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.detail||'API '+res.status);return data;}
function td(value){const e=document.createElement('td');e.className='border-t border-slate-800 p-3';e.textContent=value??'—';return e;}
async function load(){users=await call('/api/admin/users?limit=1000');document.getElementById('total').textContent=users.length;document.getElementById('active').textContent=users.filter(x=>x.status==='active').length;document.getElementById('locked').textContent=users.filter(x=>x.status==='locked').length;rows.replaceChildren();
for(const u of users){const tr=document.createElement('tr');tr.append(td(u.email));const roleCell=td('');const select=document.createElement('select');select.className='rounded bg-slate-800 p-2';for(const role of ['guest','user','admin']){const o=document.createElement('option');o.value=role;o.textContent=role.toUpperCase();o.selected=u.role===role;select.append(o);}roleCell.append(select);tr.append(roleCell,td(u.status==='active'?'Hoạt động':'Đã khóa'),td(u.expired_at?new Date(u.expired_at).toLocaleDateString('vi-VN'):'Không giới hạn'));const actions=td('');actions.className+=' space-x-2';
const btn=(label,cls,fn)=>{const b=document.createElement('button');b.textContent=label;b.className='rounded border border-slate-600 px-3 py-2 text-xs '+cls;b.onclick=fn;return b;};
actions.append(btn('Lưu vai trò','',async()=>{try{let body={role:select.value};if(body.role==='user'&&!u.expired_at){const d=prompt('Số ngày hiệu lực?','30');if(d===null)return;const n=Number(d);if(!Number.isInteger(n)||n<1||n>3650)throw Error('Số ngày phải từ 1 đến 3650.');body.expired_at=new Date(Date.now()+n*86400000).toISOString();}await call('/api/admin/users/'+encodeURIComponent(u.email)+'/role','PATCH',body);msg('Đã cập nhật vai trò.');await load();}catch(e){msg(e.message,true);}}));
actions.append(btn(u.status==='active'?'Khóa':'Mở khóa','',async()=>{try{await call('/api/admin/users/'+encodeURIComponent(u.email)+'/status','PATCH',{status:u.status==='active'?'locked':'active'});msg('Đã cập nhật trạng thái.');await load();}catch(e){msg(e.message,true);}}));
const ext=btn('Gia hạn','text-emerald-300',async()=>{const d=prompt('Gia hạn thêm bao nhiêu ngày?','30');if(d===null)return;const n=Number(d);if(!Number.isInteger(n)||n<1||n>3650){msg('Số ngày phải từ 1 đến 3650.',true);return;}try{await call('/api/admin/users/'+encodeURIComponent(u.email)+'/extend','POST',{days:n});msg('Đã gia hạn.');await load();}catch(e){msg(e.message,true);}});ext.disabled=u.role!=='user';actions.append(ext);tr.append(actions);rows.append(tr);}}
auth.onAuthStateChanged(async u=>{if(!u){msg('Cần đăng nhập. Đang chuyển về ứng dụng…',true);setTimeout(()=>location.replace('./index.html'),900);return;}try{await u.reload();await u.getIdToken(true);const me=await call('/api/auth/me');if(me.role!=='admin'){msg('Tài khoản không có quyền Admin.',true);setTimeout(()=>location.replace('./index.html'),1600);return;}document.getElementById('who').textContent='Đăng nhập: '+me.email;panel.classList.remove('hidden');await load();}catch(e){msg(e.message,true);}});
document.getElementById('refresh').onclick=()=>load().catch(e=>msg(e.message,true));document.getElementById('back').onclick=()=>location.href='./index.html';
</script></body></html>
